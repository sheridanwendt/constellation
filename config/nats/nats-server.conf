# Constellation NATS server configuration.
#
# Config-driven per docs/02-design-principles.md rather than hardcoding
# flags in docker-compose.yml. JetStream is enabled so events can be
# persisted for future retry / replay support (docs/14-event-model.md).

port: 4222

http: 8222

jetstream {
  store_dir: /data
  max_mem_store: 256MB
  max_file_store: 2GB
}
